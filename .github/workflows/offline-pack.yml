name: Offline pack

on:
  schedule:
    - cron: '0 4 * * 1' # every Monday, after Open Food Facts' daily dump
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Build the pack from the Open Food Facts dump
        run: |
          set -o pipefail
          curl -sSfL https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz | gzip -dc \
            | grep -F '"en:france"' | python3 scripts/build-offline-pack.py offline-pack.db
          ls -la offline-pack.db
      - name: Publish as a new release (never a moment without a pack)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app downloads releases/latest/download/offline-pack.db: it switches to this release only once
          # it is published with its file, and the previous one stays until the next week.
          tag="pack-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" offline-pack.db --title "Offline pack $(date -u +%Y-%m-%d)" --notes "The 100,000 most-scanned products in France, without photos. Data © Open Food Facts contributors, ODbL."
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
